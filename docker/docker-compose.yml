version: '3.8'

services:
  # 后端服务（SQLite模式 - 默认）
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: steel-backend
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../uploads:/app/uploads
      - ../captures:/app/captures
      - ../logs:/app/logs
      - ../models:/app/models
    environment:
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./data/steel_defect.db
      - SECRET_KEY=steel-defect-secret-key-2026
    networks:
      - steel-network
    restart: unless-stopped

  # Redis服务（可选，用于缓存）
  redis:
    image: redis:7-alpine
    container_name: steel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - steel-network
    restart: unless-stopped

networks:
  steel-network:
    driver: bridge

volumes:
  redis-data:
