version: '3.8'

# MySQL 版本部署
# 使用方式: docker compose -f docker-compose.mysql.yml up -d

services:
  # 后端服务（MySQL模式）
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: steel-backend
    ports:
      - "8000:8000"
    volumes:
      - ../uploads:/app/uploads
      - ../captures:/app/captures
      - ../logs:/app/logs
      - ../models:/app/models
    environment:
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=mysql://root:123456@mysql:3306/steel_defect
      - SECRET_KEY=steel-defect-secret-key-2026
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - steel-network
    restart: unless-stopped

  # MySQL服务
  mysql:
    image: mysql:8.0
    container_name: steel-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=steel_defect
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ../scripts/init_mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - steel-network
    restart: unless-stopped

  # Redis服务（可选，用于缓存）
  redis:
    image: redis:7-alpine
    container_name: steel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - steel-network
    restart: unless-stopped

networks:
  steel-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
