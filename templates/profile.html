<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 钢材缺陷检测系统</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .app {
            height: auto;
            min-height: 100vh;
            overflow: visible;
        }
        .profile-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 20px;
            flex: 1;
        }
        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-sm);
        }
        .profile-card h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-card h2 svg { width: 20px; height: 20px; color: var(--primary); }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .form-group input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 480px) {
            .form-row { grid-template-columns: 1fr; }
        }
        .info-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 15px;
            color: var(--text-primary);
            font-weight: 500;
        }
        .role-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
        }
        .role-badge.admin { background: rgba(239, 68, 68, 0.1); color: #DC2626; }
        .role-badge.personal { background: rgba(59, 130, 246, 0.1); color: #2563EB; }
        .role-badge.enterprise { background: rgba(16, 185, 129, 0.1); color: #059669; }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
        .msg {
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .msg.show { display: block; }
        .msg.error { color: var(--danger); }
        .msg.success { color: var(--success); }
    </style>
</head>
<body>
    <div class="app">
    <header class="app-header">
        <div class="brand">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 12L20 6L32 12V28L20 34L8 28V12Z" fill="currentColor" opacity="0.9"/>
                    <path d="M8 12L20 18L32 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20 18V34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M8 12V28L20 34" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M32 12V28L20 34" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="12" y1="15" x2="12" y2="25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                    <line x1="28" y1="15" x2="28" y2="25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                </svg>
            </div>
            <div class="title">
                <h1>钢材缺陷检测系统</h1>
            </div>
        </div>
        <div class="header-actions">
            <button class="profile-btn active" title="个人中心">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
            <button class="folder-btn" title="检测记录" onclick="window.location.href='/captures'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
            </button>
            <button class="settings-btn" title="设置">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </header>

    <div class="profile-container">
        <!-- 基本信息 -->
        <div class="profile-card">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                基本信息
            </h2>
            <div class="form-row" style="margin-bottom:16px;">
                <div>
                    <div class="info-label">用户名</div>
                    <div class="info-value" id="infoUsername">-</div>
                </div>
                <div>
                    <div class="info-label">用户类型</div>
                    <div class="info-value" id="infoRole">-</div>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <div class="info-label">注册时间</div>
                    <div class="info-value" id="infoCreated">-</div>
                </div>
                <div>
                    <div class="info-label">企业</div>
                    <div class="info-value" id="infoCompany">-</div>
                </div>
            </div>
        </div>

        <!-- 编辑资料 -->
        <div class="profile-card">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                编辑资料
            </h2>
            <div class="form-group">
                <label for="editDisplayName">显示名称</label>
                <input type="text" id="editDisplayName" placeholder="您的姓名">
            </div>
            <div class="form-group">
                <label for="editCompany">企业名称</label>
                <input type="text" id="editCompany" placeholder="公司/机构名称">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="editEmail">邮箱</label>
                    <input type="email" id="editEmail" placeholder="邮箱地址">
                </div>
                <div class="form-group">
                    <label for="editPhone">手机号</label>
                    <input type="tel" id="editPhone" placeholder="手机号码">
                </div>
            </div>
            <div id="profileMsg" class="msg"></div>
            <button class="btn btn-primary" id="saveProfileBtn" onclick="saveProfile()">保存修改</button>
        </div>

        <!-- 修改密码 -->
        <div class="profile-card">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                修改密码
            </h2>
            <div class="form-group">
                <label for="oldPassword">原密码</label>
                <input type="password" id="oldPassword" placeholder="请输入原密码">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" placeholder="至少6位">
                </div>
                <div class="form-group">
                    <label for="newPassword2">确认新密码</label>
                    <input type="password" id="newPassword2" placeholder="再次输入">
                </div>
            </div>
            <div id="passwordMsg" class="msg"></div>
            <button class="btn btn-primary" id="changePwdBtn" onclick="changePassword()">修改密码</button>
        </div>

        <!-- 退出登录 -->
        <div class="profile-card" style="text-align:center; grid-column: 1 / -1;">
            <button class="btn btn-danger" onclick="logout()">退出登录</button>
        </div>
    </div>
    </div>

    <script>
        const ROLE_MAP = {admin: '管理员', personal: '个人用户', enterprise: '企业用户'};

        async function loadUserInfo() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (data) {
                    const u = data;
                    document.getElementById('infoUsername').textContent = u.username;
                    // 安全：使用DOM API而非innerHTML防止XSS
                    const roleEl = document.getElementById('infoRole');
                    const roleSpan = document.createElement('span');
                    const validTypes = ['admin', 'personal', 'enterprise'];
                    const roleType = validTypes.includes(u.user_type) ? u.user_type : 'personal';
                    roleSpan.className = `role-badge ${roleType}`;
                    roleSpan.textContent = ROLE_MAP[u.user_type] || u.user_type;
                    roleEl.innerHTML = '';
                    roleEl.appendChild(roleSpan);
                    document.getElementById('infoCreated').textContent = u.created_at ? new Date(u.created_at).toLocaleString('zh-CN') : '-';
                    document.getElementById('infoCompany').textContent = u.company || '无';
                    document.getElementById('editDisplayName').value = u.display_name || u.username || '';
                    document.getElementById('editCompany').value = u.company || '';
                    document.getElementById('editEmail').value = u.email || '';
                    document.getElementById('editPhone').value = u.phone || '';
                } else {
                    window.location.href = '/login';
                }
            } catch (e) {
                window.location.href = '/login';
            }
        }

        function showMsg(id, text, type) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = 'msg show ' + type;
        }

        async function saveProfile() {
            const btn = document.getElementById('saveProfileBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/auth/update_profile', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        display_name: document.getElementById('editDisplayName').value.trim(),
                        company: document.getElementById('editCompany').value.trim(),
                        email: document.getElementById('editEmail').value.trim(),
                        phone: document.getElementById('editPhone').value.trim()
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showMsg('profileMsg', '保存成功', 'success');
                    loadUserInfo();
                } else {
                    showMsg('profileMsg', data.detail || '保存失败', 'error');
                }
            } catch (e) {
                showMsg('profileMsg', '网络错误', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function changePassword() {
            const oldPwd = document.getElementById('oldPassword').value;
            const newPwd = document.getElementById('newPassword').value;
            const newPwd2 = document.getElementById('newPassword2').value;
            if (!oldPwd || !newPwd) {
                showMsg('passwordMsg', '请填写完整', 'error');
                return;
            }
            if (newPwd !== newPwd2) {
                showMsg('passwordMsg', '两次输入的密码不一致', 'error');
                return;
            }
            const btn = document.getElementById('changePwdBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/auth/change_password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({old_password: oldPwd, new_password: newPwd})
                });
                const data = await res.json();
                if (res.ok) {
                    showMsg('passwordMsg', '密码修改成功', 'success');
                    document.getElementById('oldPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('newPassword2').value = '';
                } else {
                    showMsg('passwordMsg', data.detail || '修改失败', 'error');
                }
            } catch (e) {
                showMsg('passwordMsg', '网络错误', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function logout() {
            try { await fetch('/logout'); } catch(e) {}
            window.location.href = '/login';
        }

        loadUserInfo();

        // 如果在iframe中，修改按钮行为
        if (window.self !== window.top) {
            // 在iframe中：点击个人中心按钮关闭iframe
            document.querySelector('.profile-btn').addEventListener('click', (e) => {
                e.preventDefault();
                window.parent.postMessage({ action: 'closeProfile' }, window.location.origin);
            });
            // 检测记录按钮也通过父页面跳转
            document.querySelector('.folder-btn').addEventListener('click', (e) => {
                e.preventDefault();
                window.parent.postMessage({ action: 'navigateToHome' }, window.location.origin);
                // 延迟一下再触发父页面的检测记录按钮
                setTimeout(() => {
                    window.parent.document.getElementById('folderBtn')?.click();
                }, 100);
            });
        }
    </script>
</body>
</html>
